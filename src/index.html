<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1a56db" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161b22"  media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="SED Punjab School Enrollment Monitoring Dashboard">
  <title>SEDP Enrollment</title>

  <link rel="stylesheet" href="styles.css">

  <!-- jsPDF + autoTable for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js" defer></script>
  <!-- Chart.js — used only for Insights donut -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
</head>

<body>

<!-- ============================================================
     LOADER OVERLAY — shown until data is ready
     ============================================================ -->
<div id="loader-overlay">
  <div class="loader-spinner"></div>
  <div class="loader-text" id="loader-text">Loading Punjab Data...</div>
  <div class="loader-sub" id="loader-sub">Connecting to data source</div>
</div>

<!-- ============================================================
     APP SHELL
     ============================================================ -->
<div id="app">

  <!-- ── TOP HEADER ── -->
  <header id="app-header">
    <div>
      <div class="header-title" id="header-title">SEDP Enrollment</div>
      <div class="header-subtitle" id="header-subtitle">Loading...</div>
    </div>

    <div class="header-actions">
      <!-- Scope pill — shows active filter, tapping opens drawer -->
      <button class="scope-pill" id="scope-pill" onclick="openFilterDrawer()" aria-label="Change filter scope">
        <!-- Filter funnel icon -->
        <svg viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        <span id="scope-pill-text">All Punjab</span>
      </button>

      <!-- Search icon — only shown on Schools tab -->
      <button class="icon-btn" id="search-toggle-btn" onclick="toggleSearch()" aria-label="Search schools" style="display:none;">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>

    <!-- Search bar — slides down over header when open -->
    <div class="search-bar-wrap" id="search-bar-wrap">
      <svg style="width:18px;height:18px;stroke:var(--text-muted);fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0;" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input
        type="search"
        class="search-input"
        id="school-search-input"
        placeholder="Search school name or EMIS..."
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        oninput="onSearchInput(this.value)"
      >
      <button class="search-cancel" onclick="closeSearch()">Cancel</button>
    </div>
  </header>

  <!-- ── TAB CONTENT ── -->
  <main id="tab-content">

    <!-- HOME TAB -->
    <section id="tab-home" class="tab-pane active" role="tabpanel" aria-label="Home">
      <!-- Populated by home.js -->
    </section>

    <!-- SCHOOLS TAB -->
    <section id="tab-schools" class="tab-pane" role="tabpanel" aria-label="Schools">
      <!-- Toolbar: filter dropdown + sort -->
      <div class="tab-toolbar" id="schools-toolbar">
        <select class="filter-chip-select" id="school-filter-select" onchange="applySchoolFilter(this.value)" aria-label="Filter schools">
          <option value="all_schools">All Schools</option>
          <option value="below_baseline">Below Baseline</option>
          <option value="below_target">Below Target</option>
          <option value="above_baseline_below_target">Above Baseline, Below Target</option>
          <option value="above_target">Above Target</option>
        </select>
        <select class="sort-select" id="schools-sort-select" onchange="applySchoolSort(this.value)" aria-label="Sort schools">
          <option value="ach">Ach%</option>
          <option value="ntAch">NT Ach%</option>
          <option value="name">Name</option>
          <option value="emis">EMIS</option>
        </select>
      </div>

      <!-- List header: count badge -->
      <div class="list-section-header">
        <span id="schools-list-label">Schools</span>
        <span class="list-count-badge" id="schools-count-badge">0</span>
      </div>

      <!-- Virtual scroll host — JS owns everything inside -->
      <div id="schools-scroll-host">
        <!-- virtual-scroll-container injected by schools.js -->
      </div>
    </section>

    <!-- INSIGHTS TAB -->
    <section id="tab-insights" class="tab-pane" role="tabpanel" aria-label="Insights">
      <!-- Populated by insights.js -->
    </section>

    <!-- BREAKDOWN TAB -->
    <section id="tab-breakdown" class="tab-pane" role="tabpanel" aria-label="Breakdown">
      <!-- Toolbar: view-by selector + sort -->
      <div class="breakdown-toolbar" id="breakdown-toolbar">
        <select class="view-by-select" id="view-by-select" onchange="applyBreakdownView(this.value)" aria-label="View breakdown by">
          <option value="district">By District</option>
          <option value="wing">By Wing</option>
          <option value="tehsil">By Tehsil</option>
          <option value="markaz">By Markaz</option>
        </select>
        <select class="sort-select" id="breakdown-sort-select" onchange="applyBreakdownSort(this.value)" aria-label="Sort breakdown">
          <option value="ach">Ach%</option>
          <option value="ntAch">NT Ach%</option>
          <option value="name">Name</option>
        </select>
      </div>

      <div class="list-section-header">
        <span id="breakdown-list-label">Breakdown</span>
        <span class="list-count-badge" id="breakdown-count-badge">0</span>
      </div>

      <!-- Breakdown rows injected by breakdown.js -->
      <div id="breakdown-list"></div>
    </section>

    <!-- EXPORT TAB -->
    <section id="tab-export" class="tab-pane" role="tabpanel" aria-label="Export">
      <!-- Populated by export.js -->
    </section>

  </main>

  <!-- ── BOTTOM NAVIGATION ── -->
  <nav id="bottom-nav" role="navigation" aria-label="Main navigation">

    <button class="nav-item active" id="nav-home" onclick="switchTab('home')" aria-label="Home tab">
      <svg viewBox="0 0 24 24">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span class="nav-label">Home</span>
    </button>

    <button class="nav-item" id="nav-schools" onclick="switchTab('schools')" aria-label="Schools tab">
      <svg viewBox="0 0 24 24">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke-dasharray="60" stroke-dashoffset="0"/>
        <line x1="12" y1="2" x2="12" y2="22"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
      </svg>
      <span class="nav-label">Schools</span>
    </button>

    <button class="nav-item" id="nav-insights" onclick="switchTab('insights')" aria-label="Insights tab">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span class="nav-label">Insights</span>
    </button>

    <button class="nav-item" id="nav-breakdown" onclick="switchTab('breakdown')" aria-label="Breakdown tab">
      <svg viewBox="0 0 24 24">
        <line x1="8" y1="6" x2="21" y2="6"/>
        <line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/>
        <line x1="3" y1="12" x2="3.01" y2="12"/>
        <line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
      <span class="nav-label">Breakdown</span>
    </button>

    <button class="nav-item" id="nav-export" onclick="switchTab('export')" aria-label="Export tab">
      <svg viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span class="nav-label">Export</span>
    </button>

  </nav>

</div><!-- /#app -->

<!-- ============================================================
     FILTER DRAWER
     ============================================================ -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeFilterDrawer()"></div>

<div class="drawer" id="filter-drawer" role="dialog" aria-modal="true" aria-label="Filter by location">
  <div class="drawer-handle"></div>

  <div class="drawer-header">
    <span class="drawer-title">Filter Scope</span>
    <button class="icon-btn" onclick="closeFilterDrawer()" aria-label="Close filter drawer">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <div class="drawer-body">
    <div class="drawer-field">
      <label for="drawer-district">District</label>
      <select class="drawer-select" id="drawer-district" onchange="onDrawerDistrictChange()" aria-label="Select district">
        <option value="">All Districts</option>
      </select>
    </div>

    <div class="drawer-field">
      <label for="drawer-wing">Wing</label>
      <select class="drawer-select" id="drawer-wing" onchange="onDrawerWingChange()" disabled aria-label="Select wing">
        <option value="">All Wings</option>
      </select>
    </div>

    <div class="drawer-field">
      <label for="drawer-tehsil">Tehsil</label>
      <select class="drawer-select" id="drawer-tehsil" onchange="onDrawerTehsilChange()" disabled aria-label="Select tehsil">
        <option value="">All Tehsils</option>
      </select>
    </div>

    <div class="drawer-field">
      <label for="drawer-markaz">Markaz</label>
      <select class="drawer-select" id="drawer-markaz" disabled aria-label="Select markaz">
        <option value="">All Markaz</option>
      </select>
    </div>
  </div>

  <div class="drawer-footer">
    <button class="btn btn-ghost" onclick="resetFilterDrawer()">Reset</button>
    <button class="btn btn-primary" onclick="applyFilterDrawer()">Apply Filter</button>
  </div>
</div>

<!-- ============================================================
     SCRIPTS — load order matters
     ============================================================ -->
<script src="fetch-data.js"></script>
<script src="tabs/home.js"></script>
<script src="tabs/schools.js"></script>
<script src="tabs/insights.js"></script>
<script src="tabs/breakdown.js"></script>
<script src="tabs/export.js"></script>
<script src="components/filter-drawer.js"></script>
<script src="components/bottom-nav.js"></script>

</body>
</html>
